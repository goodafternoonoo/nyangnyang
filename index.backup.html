<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>우당탕탕 냥냥펀치</title>
    <style>
        @font-face {
            font-family: 'OngleipParkDahyeon';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2411-3@1.0/Ownglyph_ParkDaHyun.woff2') format('woff2');
            font-weight: normal;
            font-display: swap;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #2c3e50;
            overflow: hidden;
            touch-action: none;
            font-family: 'OngleipParkDahyeon', sans-serif;
        }

        #game-container {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #font-preload {
            font-family: 'OngleipParkDahyeon';
            position: absolute;
            visibility: hidden;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
</head>

<body>

    <div id="font-preload">폰트 로딩용</div>
    <div id="game-container"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // ---------------------------------------------------------
        // 사운드 생성기 (Web Audio API)
        // ---------------------------------------------------------
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(freq, type, duration, volume = 0.1, slide = 0) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            if (slide !== 0) {
                osc.frequency.exponentialRampToValueAtTime(freq + slide, audioCtx.currentTime + duration);
            }
            gain.gain.setValueAtTime(volume, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        const SFX = {
            punch: () => playSound(150, 'sine', 0.1, 0.2, -100),
            evoPunch: () => playSound(100, 'sawtooth', 0.3, 0.15, 200),
            gem: () => playSound(800, 'sine', 0.1, 0.1, 400),
            levelUp: () => {
                playSound(400, 'triangle', 0.2, 0.1);
                setTimeout(() => playSound(500, 'triangle', 0.2, 0.1), 100);
                setTimeout(() => playSound(600, 'triangle', 0.4, 0.1), 200);
            },
            hit: () => playSound(80, 'square', 0.1, 0.1),
            meow: () => playSound(600, 'triangle', 0.3, 0.05, 200),
            evo: () => playSound(200, 'sawtooth', 0.5, 0.1, 800),
            alarm: () => {
                playSound(600, 'square', 0.3, 0.15, -200);
                setTimeout(() => playSound(600, 'square', 0.3, 0.15, -200), 400);
                setTimeout(() => playSound(600, 'square', 0.3, 0.15, -200), 800);
            },
            box: () => {
                playSound(300, 'sine', 0.5, 0.2, 500);
                setTimeout(() => playSound(400, 'sine', 0.5, 0.2, 500), 200);
            },
            coin: () => playSound(1200, 'sine', 0.05, 0.1, 100),
            buy: () => playSound(1000, 'sine', 0.1, 0.1, 300)
        };

        // ---------------------------------------------------------
        // 전역 변수 및 상태
        // ---------------------------------------------------------
        let player, cursors, keys, enemies, bosses, gems, boxes, yarns, fishbones, hairballs, punches, coins;
        let timerText, levelText, hpBarFill, hpText, expBarFill, coinTextUI;
        let skillIconsGroup, stats;
        let isPaused, elapsedSeconds, joystickBase, joystickThumb, isDragging = false, joystickVector = new Phaser.Math.Vector2(0, 0);
        let playerShadow, currentScene, game;

        // ---------------------------------------------------------
        // Firebase 영구 저장소 설정
        // ---------------------------------------------------------
        const firebaseConfig = typeof __firebase_config !== 'undefined' && __firebase_config ? JSON.parse(__firebase_config) : {};
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

        let app, auth, db, currentUser = null;
        let useFirebase = Object.keys(firebaseConfig).length > 0;

        if (useFirebase) {
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
        }

        let globalState = {
            coins: 0,
            upgrades: { hp: 0, speed: 0, damage: 0, magnet: 0 }
        };

        async function loadSaveData() {
            if (!useFirebase || !currentUser) return;
            const docRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'savedata', 'progress');
            try {
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    if (data.coins !== undefined) globalState.coins = data.coins;
                    if (data.upgrades !== undefined) globalState.upgrades = data.upgrades;
                }
            } catch (e) { console.error("데이터 불러오기 실패:", e); }
        }

        async function saveGameData() {
            if (!useFirebase || !currentUser) return;
            const docRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'savedata', 'progress');
            try {
                await setDoc(docRef, { coins: globalState.coins, upgrades: globalState.upgrades }, { merge: true });
            } catch (e) { console.error("데이터 저장 실패:", e); }
        }

        const upgradeConfig = [
            { key: 'hp', title: '최대 체력 증가', baseCost: 50, maxLv: 10, effect: '+10' },
            { key: 'speed', title: '이동 속도 증가', baseCost: 50, maxLv: 5, effect: '+10' },
            { key: 'damage', title: '기본 데미지 증가', baseCost: 100, maxLv: 10, effect: '+5' },
            { key: 'magnet', title: '자석 범위 증가', baseCost: 80, maxLv: 5, effect: '+20' }
        ];

        // ---------------------------------------------------------
        // 로비 씬
        // ---------------------------------------------------------
        const LobbyScene = {
            key: 'LobbyScene',
            preload: function () {
                if (this.textures.exists('wood_floor')) return;

                let wood = this.make.graphics({ x: 0, y: 0, add: false });
                wood.fillStyle(0x795548).fillRect(0, 0, 100, 100).lineStyle(3, 0x5D4037).strokeRect(0, 0, 100, 100);
                wood.lineStyle(2, 0x6D4C41, 0.8).lineBetween(33, 0, 33, 100).lineBetween(66, 0, 66, 100);
                wood.fillStyle(0x3E2723).fillCircle(16, 10, 2).fillCircle(16, 90, 2).fillCircle(84, 10, 2).fillCircle(84, 90, 2);
                wood.generateTexture('wood_floor', 100, 100);

                let stain = this.make.graphics({ x: 0, y: 0, add: false });
                stain.fillStyle(0x4E342E, 0.2).fillEllipse(30, 30, 30, 20);
                stain.generateTexture('stain', 60, 60);

                let cat = this.make.graphics({ x: 0, y: 0, add: false });
                cat.fillStyle(0x000000, 0.3).fillEllipse(25, 48, 30, 10);
                cat.lineStyle(5, 0x8D5524, 1);
                cat.beginPath().moveTo(25, 38).lineTo(42, 35).lineTo(48, 22).strokePath();
                cat.fillStyle(0x8D5524).fillTriangle(8, 18, 20, 2, 28, 18).fillTriangle(42, 18, 30, 2, 22, 18);
                cat.fillStyle(0xF8BBD0).fillTriangle(12, 16, 20, 6, 26, 16).fillTriangle(38, 16, 30, 6, 24, 16);
                cat.fillStyle(0xC17753).fillEllipse(25, 30, 38, 32);
                cat.fillStyle(0xE6A57A).fillEllipse(25, 34, 20, 18);
                cat.fillStyle(0x212121).fillCircle(17, 26, 3.5).fillCircle(33, 26, 3.5);
                cat.fillStyle(0xFFFFFF).fillCircle(18, 24, 1.5).fillCircle(34, 24, 1.5);
                cat.fillStyle(0xFF77A9).fillTriangle(23, 31, 27, 31, 25, 33.5);
                cat.lineStyle(1.5, 0x5D4037, 1).beginPath().moveTo(25, 33.5).lineTo(21, 36).moveTo(25, 33.5).lineTo(29, 36).strokePath();
                cat.lineStyle(1, 0xFFFFFF, 0.8).beginPath().moveTo(15, 32).lineTo(2, 30).moveTo(15, 34).lineTo(4, 35).moveTo(35, 32).lineTo(48, 30).moveTo(35, 34).lineTo(46, 35).strokePath();
                cat.generateTexture('yulmu', 50, 50);

                let dust = this.make.graphics({ x: 0, y: 0, add: false });
                dust.fillStyle(0x78909C);
                for (let i = 0; i < 8; i++) { let a = (Math.PI / 4) * i; dust.fillCircle(24 + Math.cos(a) * 10, 26 + Math.sin(a) * 10, 10); }
                dust.fillCircle(24, 26, 14);
                dust.lineStyle(3, 0x212121, 1).beginPath().moveTo(16, 22).lineTo(20, 25).lineTo(16, 28).strokePath().beginPath().moveTo(32, 22).lineTo(28, 25).lineTo(32, 28).strokePath();
                dust.generateTexture('dust', 48, 48);

                let fur = this.make.graphics({ x: 0, y: 0, add: false });
                fur.fillStyle(0x37474F);
                for (let i = 0; i < 12; i++) { let a = (Math.PI / 6) * i; fur.fillTriangle(24, 26, 24 + Math.cos(a - 0.2) * 18, 26 + Math.sin(a - 0.2) * 18, 24 + Math.cos(a + 0.2) * 18, 26 + Math.sin(a + 0.2) * 18); }
                fur.fillCircle(24, 26, 14);
                fur.fillStyle(0xFFEE58).fillCircle(18, 24, 3).fillCircle(30, 24, 3);
                fur.generateTexture('furball', 48, 48);

                let toy = this.make.graphics({ x: 0, y: 0, add: false });
                toy.fillStyle(0x8D6E63).fillRoundedRect(16, 14, 24, 28, 4);
                toy.fillStyle(0x212121).fillRect(20, 20, 16, 8);
                toy.fillStyle(0xFF5252).fillCircle(24, 24, 2.5).fillCircle(32, 24, 2.5);
                toy.fillStyle(0x9E9E9E).fillRect(40, 24, 6, 4).fillCircle(46, 26, 4);
                toy.generateTexture('toy', 56, 56);

                let vacuum = this.make.graphics({ x: 0, y: 0, add: false });
                vacuum.fillStyle(0x1F1F1F).fillCircle(50, 50, 45);
                vacuum.lineStyle(6, 0x424242).strokeCircle(50, 50, 42);
                vacuum.fillStyle(0x424242).fillCircle(50, 50, 25);
                vacuum.fillStyle(0xFF3D00).fillCircle(50, 30, 6);
                vacuum.fillStyle(0x00E676).fillRect(35, 65, 30, 6);
                vacuum.generateTexture('boss_vacuum', 100, 100);

                let box = this.make.graphics({ x: 0, y: 0, add: false });
                box.fillStyle(0x8D6E63).fillRect(10, 15, 40, 30);
                box.fillStyle(0x795548).fillRect(10, 10, 40, 15);
                box.fillStyle(0xFFCC80).fillRect(26, 10, 8, 35);
                box.generateTexture('treasure_box', 60, 60);

                let punch = this.make.graphics({ x: 0, y: 0, add: false });
                punch.fillStyle(0xFFFFFF).fillCircle(24, 28, 10).fillCircle(12, 14, 4).fillCircle(20, 10, 4).fillCircle(28, 10, 4).fillCircle(36, 14, 4);
                punch.generateTexture('punch', 48, 48);

                let gPunch = this.make.graphics({ x: 0, y: 0, add: false });
                gPunch.fillStyle(0xFFFFFF).fillCircle(40, 45, 18).fillCircle(20, 25, 7).fillCircle(33, 18, 7).fillCircle(47, 18, 7).fillCircle(60, 25, 7);
                gPunch.generateTexture('punch_evo', 80, 80);

                this.make.graphics({ x: 0, y: 0, add: false }).fillStyle(0x00BFA5).beginPath().moveTo(12, 2).lineTo(22, 12).lineTo(12, 22).lineTo(2, 12).fillPath().generateTexture('gem', 24, 24);

                let coinG = this.make.graphics({ x: 0, y: 0, add: false });
                coinG.fillStyle(0xFFD700).fillCircle(12, 12, 10).fillStyle(0xFFA000).fillCircle(12, 12, 6);
                coinG.generateTexture('coin', 24, 24);

                this.make.graphics({ x: 0, y: 0, add: false }).fillStyle(0xE91E63).fillCircle(20, 20, 16).generateTexture('yarn', 40, 40);
                this.make.graphics({ x: 0, y: 0, add: false }).fillStyle(0x212121).fillCircle(25, 25, 22).generateTexture('yarn_evo', 50, 50);
                this.make.graphics({ x: 0, y: 0, add: false }).lineStyle(3, 0xffffff).lineBetween(5, 15, 35, 15).lineBetween(10, 5, 10, 25).lineBetween(20, 5, 20, 25).lineBetween(30, 5, 30, 25).generateTexture('fishbone', 50, 30);
                this.make.graphics({ x: 0, y: 0, add: false }).fillStyle(0x03A9F4).fillCircle(16, 16, 16).generateTexture('hairball', 32, 32);
            },
            create: function () {
                let cam = this.cameras.main;
                let bgFloor = this.add.tileSprite(cam.centerX, cam.centerY, 3000, 3000, 'wood_floor');
                let bgDark = this.add.rectangle(cam.centerX, cam.centerY, 3000, 3000, 0x000000, 0.75);

                let uiContainer = this.add.container(cam.centerX, cam.centerY);

                uiContainer.add(this.add.text(0, -250, '우당탕탕 냥냥펀치', { fontFamily: 'OngleipParkDahyeon', fontSize: '64px', fill: '#FFD700', stroke: '#000', strokeThickness: 6 }).setOrigin(0.5));
                uiContainer.add(this.add.text(0, -180, `보유 츄르 코인: 🪙 ${globalState.coins}`, { fontFamily: 'OngleipParkDahyeon', fontSize: '28px', fill: '#fff' }).setOrigin(0.5));

                upgradeConfig.forEach((upg, index) => {
                    let curLv = globalState.upgrades[upg.key];
                    let cost = Math.floor(upg.baseCost * Math.pow(1.5, curLv));
                    let isMax = curLv >= upg.maxLv;
                    let yPos = -80 + (index * 65);

                    uiContainer.add(this.add.graphics().fillStyle(0x2A2A35).fillRoundedRect(-210, yPos - 25, 420, 50, 10).lineStyle(2, 0x4a4a5a).strokeRoundedRect(-210, yPos - 25, 420, 50, 10));
                    uiContainer.add(this.add.text(-190, yPos, `${upg.title} (Lv.${curLv}/${upg.maxLv})`, { fontFamily: 'OngleipParkDahyeon', fontSize: '20px', fill: '#fff' }).setOrigin(0, 0.5));
                    uiContainer.add(this.add.text(-10, yPos, `효과: ${upg.effect}`, { fontFamily: 'OngleipParkDahyeon', fontSize: '15px', fill: '#ccc' }).setOrigin(0, 0.5));

                    if (!isMax) {
                        let canAfford = globalState.coins >= cost;
                        uiContainer.add(this.add.graphics().fillStyle(canAfford ? 0x00E676 : 0x555555).fillRoundedRect(110, yPos - 18, 80, 36, 8));
                        uiContainer.add(this.add.text(150, yPos, `🪙 ${cost}`, { fontFamily: 'OngleipParkDahyeon', fontSize: '18px', fill: '#fff' }).setOrigin(0.5));
                        let hitArea = this.add.rectangle(150, yPos, 80, 36, 0, 0).setInteractive({ useHandCursor: true });
                        uiContainer.add(hitArea);
                        hitArea.on('pointerdown', () => {
                            if (globalState.coins >= cost) {
                                globalState.coins -= cost;
                                globalState.upgrades[upg.key]++;
                                SFX.buy();
                                saveGameData(); // 💾 업그레이드 성공 시 클라우드에 자동 저장
                                this.scene.restart();
                            } else {
                                SFX.hit();
                            }
                        });
                    } else {
                        uiContainer.add(this.add.text(150, yPos, `MAX`, { fontFamily: 'OngleipParkDahyeon', fontSize: '22px', fill: '#FFD700' }).setOrigin(0.5));
                    }
                });

                let btn = this.add.text(0, 230, '게임 시작', { fontFamily: 'OngleipParkDahyeon', fontSize: '32px', fill: '#fff', backgroundColor: '#FF4081', padding: { x: 20, y: 10 } }).setOrigin(0.5).setInteractive({ useHandCursor: true });
                uiContainer.add(btn);
                btn.on('pointerdown', () => { SFX.meow(); this.scene.start('GameScene'); });

                // 리사이즈 이벤트 설정
                this.scale.on('resize', (gameSize) => {
                    let w = gameSize.width, h = gameSize.height;
                    bgFloor.setPosition(w/2, h/2);
                    bgDark.setPosition(w/2, h/2);
                    uiContainer.setPosition(w/2, h/2);
                }, this);
            }
        };

        // ---------------------------------------------------------
        // 게임 씬
        // ---------------------------------------------------------
        const GameScene = {
            key: 'GameScene',
            create: function () {
                currentScene = this;
                initGameState();

                this.physics.world.setBounds(0, 0, 3000, 3000);
                this.add.tileSprite(1500, 1500, 3000, 3000, 'wood_floor').setDepth(0);
                for (let i = 0; i < 70; i++) this.add.image(Phaser.Math.Between(50, 2950), Phaser.Math.Between(50, 2950), 'stain').setDepth(1);

                playerShadow = this.add.ellipse(1500, 1525, 40, 15, 0x000000, 0.3).setDepth(9);
                player = this.physics.add.sprite(1500, 1500, 'yulmu').setDepth(10);
                player.body.setSize(24, 24).setOffset(13, 16);
                player.setCollideWorldBounds(true);

                this.cameras.main.startFollow(player).setBounds(0, 0, 3000, 3000);

                setupGroups(this);
                setupUI(this);
                setupInput(this);

                this.time.addEvent({ delay: 1000, callback: handleGameTick, callbackScope: this, loop: true });
                this.physics.add.overlap(player, gems, collectGem, null, this);
                this.physics.add.overlap(player, coins, collectCoin, null, this);
                this.physics.add.overlap(player, boxes, collectBox, null, this);
                this.physics.add.collider(player, enemies, takeDamage, null, this);
                this.physics.add.collider(player, bosses, takeDamage, null, this);
                this.physics.add.overlap(enemies, [yarns, fishbones, hairballs], hitByWeapon, null, this);
                this.physics.add.overlap(bosses, [yarns, fishbones, hairballs], hitByWeapon, null, this);

                updateUI();
            },
            update: function (time, delta) {
                if (stats.hp <= 0 || isPaused) return;
                handlePlayerMovement(time);
                handleEnemyMovement(this, time);
                handleWeapons(this, time, delta); // 🐛 delta 값을 사용하도록 수정됨
                handleItems(this);
                updateUI();
            }
        };

        function initGameState() {
            let hpLv = globalState.upgrades.hp, spdLv = globalState.upgrades.speed, dmgLv = globalState.upgrades.damage, magLv = globalState.upgrades.magnet;
            let baseMaxHp = 100 + (hpLv * 10), baseSpeed = 160 + (spdLv * 10), baseDmg = 30 + (dmgLv * 5), baseMagnet = 160 + (magLv * 20);

            stats = {
                hp: baseMaxHp, maxHp: baseMaxHp, exp: 0, level: 1, speed: baseSpeed,
                attackRange: 140, attackDamage: baseDmg, attackCooldown: 850, attackScale: 1,
                yarnCount: 0, yarnDamage: 22, magnetRange: baseMagnet, expMultiplier: 1.0, defense: 0, hpRegen: 0, knockbackMult: 1.0,
                fishBoneCount: 0, fishBoneDamage: 35, hairballLevel: 0, hairballDamage: 25,
                skills: { punch: 1, aspeed: 0, yarn: 0, fishbone: 0, hairball: 0, magnet: 0, regen: 0, defense: 0, exp: 0 },
                isPunchEvo: false, isYarnEvo: false, isHairballEvo: false, bossSpawns: [], coinCount: 0,
                timers: { punch: 0, hairball: 0, fishbone: 0 } // 🐛 시간 점프(Time Jump) 버그 수정을 위한 내부 타이머
            };
            isPaused = false; elapsedSeconds = 0;
            isDragging = false; joystickVector.set(0, 0);
        }

        function setupGroups(scene) {
            enemies = scene.physics.add.group(); bosses = scene.physics.add.group(); gems = scene.physics.add.group();
            coins = scene.physics.add.group(); boxes = scene.physics.add.group(); yarns = scene.physics.add.group();
            fishbones = scene.physics.add.group(); hairballs = scene.physics.add.group(); punches = scene.add.group();
        }

        function setupUI(scene) {
            scene.add.graphics().setScrollFactor(0).setDepth(100).fillStyle(0x000000, 0.5).fillRoundedRect(10, 10, 220, 155, 12);
            timerText = scene.add.text(25, 22, '⏱ 00:00', { fontFamily: 'OngleipParkDahyeon', fontSize: '20px', fill: '#fff' }).setScrollFactor(0).setDepth(101);
            levelText = scene.add.text(140, 22, 'Lv.1', { fontFamily: 'OngleipParkDahyeon', fontSize: '20px', fill: '#FFD700' }).setScrollFactor(0).setDepth(101);
            coinTextUI = scene.add.text(25, 48, '🪙 0', { fontFamily: 'OngleipParkDahyeon', fontSize: '18px', fill: '#FFD700' }).setScrollFactor(0).setDepth(101);
            scene.add.graphics().setScrollFactor(0).setDepth(100).fillStyle(0x000000, 0.6).fillRoundedRect(20, 75, 190, 18, 9).fillRoundedRect(20, 100, 190, 8, 4);
            hpBarFill = scene.add.graphics().setScrollFactor(0).setDepth(101); expBarFill = scene.add.graphics().setScrollFactor(0).setDepth(101);
            hpText = scene.add.text(115, 84, '100 / 100', { fontFamily: 'OngleipParkDahyeon', fontSize: '13px', fill: '#fff' }).setOrigin(0.5).setScrollFactor(0).setDepth(102);
            skillIconsGroup = scene.add.group();
        }

        function setupInput(scene) {
            cursors = scene.input.keyboard.createCursorKeys(); keys = scene.input.keyboard.addKeys('W,A,S,D');
            joystickBase = scene.add.circle(0, 0, 60, 0x000000, 0.3).setScrollFactor(0).setDepth(99).setVisible(false);
            joystickThumb = scene.add.circle(0, 0, 30, 0xffffff, 0.5).setScrollFactor(0).setDepth(99).setVisible(false);
            scene.input.on('pointerdown', p => { if (audioCtx.state === 'suspended') audioCtx.resume(); isDragging = true; joystickBase.setPosition(p.x, p.y).setVisible(true); joystickThumb.setPosition(p.x, p.y).setVisible(true); });
            scene.input.on('pointermove', p => { if (isDragging) { let a = Phaser.Math.Angle.Between(joystickBase.x, joystickBase.y, p.x, p.y); let d = Math.min(60, Phaser.Math.Distance.Between(joystickBase.x, joystickBase.y, p.x, p.y)); joystickThumb.x = joystickBase.x + Math.cos(a) * d; joystickThumb.y = joystickBase.y + Math.sin(a) * d; joystickVector.set(Math.cos(a), Math.sin(a)); } });
            scene.input.on('pointerup', () => { isDragging = false; joystickBase.setVisible(false); joystickThumb.setVisible(false); joystickVector.set(0, 0); });

            // 🐛 모바일 화면 밖 이탈(Stuck) 방지 이벤트 추가
            scene.input.on('pointerupoutside', () => { isDragging = false; joystickBase.setVisible(false); joystickThumb.setVisible(false); joystickVector.set(0, 0); });
        }

        function handleGameTick() {
            if (isPaused || stats.hp <= 0) return; // 타이머도 일시정지 상태 확인
            elapsedSeconds++; stats.hp = Math.min(stats.maxHp, stats.hp + stats.hpRegen);

        function handlePlayerMovement(time) {
            player.setVelocity(0); let mx = 0, my = 0;
            if (cursors.left.isDown || keys.A.isDown) mx = -1; else if (cursors.right.isDown || keys.D.isDown) mx = 1;
            if (cursors.up.isDown || keys.W.isDown) my = -1; else if (cursors.down.isDown || keys.S.isDown) my = 1;

        function handleEnemyMovement(scene, time) {

        function handleWeapons(scene, time, delta) {
            // 🐛 레벨업 창 닫을 때 무기 폭주(Time Jump)를 막기 위해 절대 시간이 아닌 Delta(프레임시간) 누적 사용
            stats.timers.punch += delta;
            stats.timers.hairball += delta;
            stats.timers.fishbone += delta;

            if (stats.timers.punch >= stats.attackCooldown) {
                performNyangPunch(scene);
                stats.timers.punch = 0;
            }
            if ((stats.skills.hairball > 0 || stats.skills.hairball === "MAX") && stats.timers.hairball >= 1300) {
                fireHairball(scene);
                stats.timers.hairball = 0;
            }
            if ((stats.skills.fishbone > 0 || stats.skills.fishbone === "MAX") && stats.timers.fishbone >= 2600) {

                stats.timers.fishbone = 0;
            }

            if (stats.skills.yarn > 0 || stats.skills.yarn === "MAX") {
                yarns.getChildren().forEach((y, i) => {
                    let a = (time * (stats.isYarnEvo ? 0.007 : 0.0035)) + ((Math.PI * 2 / stats.yarnCount) * i);

            });

        function performNyangPunch(scene) {
            let target = getNearestEnemy(stats.attackRange);

                let angle = Phaser.Math.Angle.Between(player.x, player.y, target.x, target.y);
                let px = player.x + Math.cos(angle) * 55, py = player.y + Math.sin(angle) * 55;

        function getNearestEnemy(range) {

        function applyDamage(enemy, damage) {

        }

        function hitByWeapon(enemy, weapon) { if (!enemy.active || !weapon.active) return; let dmg = weapon.damage || stats.yarnDamage; let wType = weapon.texture.key; if (wType === 'hairball') { weapon.disableBody(true, true); SFX.punch(); } else { enemy.lastHitTimes = enemy.lastHitTimes || {}; if (enemy.lastHitTimes[wType] && weapon.scene.time.now < enemy.lastHitTimes[wType] + 300) return; enemy.lastHitTimes[wType] = weapon.scene.time.now; SFX.hit(); } applyDamage(enemy, dmg); }

        function spawnBoss(waveMin) {
            SFX.alarm(); let cam = currentScene.cameras.main;
            let t = currentScene.add.text(cam.scrollX + cam.centerX, cam.scrollY + cam.centerY - 150, '🚨 거대 로봇 청소기 접근 중! 🚨', { fontFamily: 'OngleipParkDahyeon', fontSize: '48px', fill: '#ff0000', stroke: '#fff', strokeThickness: 6 }).setOrigin(0.5).setDepth(300);

        function collectBox(p, box) { box.disableBody(true, true); SFX.box(); enemies.getChildren().forEach(e => { if (e.active) applyDamage(e, e.hp + 9999); }); stats.exp += (stats.level * 55) * 3; checkLvl(p.scene); updateUI(); }

        function checkLvl(scene) { let n = stats.level * 55; if (stats.exp >= n) { stats.exp -= n; stats.level++; showLevelUpUI(scene); return true; } return false; }

        function spawnEnemy() {

        function takeDamage(p, e) { if (p.isInvincible) return; SFX.hit(); let dmg = e.isBoss ? 40 : 12; stats.hp -= Math.max(1, dmg - stats.defense); p.isInvincible = true; p.setTint(0xff0000); if (stats.hp <= 0) { p.scene.physics.pause(); isPaused = true; showGameOverUI(p.scene); } p.scene.time.delayedCall(500, () => { p.isInvincible = false; p.clearTint(); }); }

                    case 'fishbone': stats.fishBoneDamage *= 2.8; stats.fishBoneCount += 3; break;

                    case 'defense': stats.defense += 8; break;

        }

                // 1. Firebase 인증
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }

                // 2. 클라우드에서 기존 유저 데이터(코인, 스탯) 불러오기
                onAuthStateChanged(auth, async (user) => {
                    if (user) {
                        currentUser = user;
                        await loadSaveData();
                        if (!game) initGame();
                    }
                });
            } else {
                // Firebase가 없는 환경일 경우 임시 메모리로 바로 시작
                initGame();
            }
        });

    </script>
</body>

</html>
